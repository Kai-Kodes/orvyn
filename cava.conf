[general]
bars = 80
framerate = 60
autosens = 1
sensitivity = 100

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 32
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 50
monstercat = 0
waves = 0
